# LLM model parameters
llms:
  api:
    model: "gpt-5.4-mini"
    provider: "openai"
    base_url: "https://llm.inzhenerka-cloud.com/"
    timeout: 60
    max_output_tokens: 1024
  ollama:
    model: "qwen2.5:0.5b"
    provider: "ollama"
    base_url: "http://localhost:11434/"
    timeout: 60
    max_output_tokens: 1024

# RAG parameters
rag:
  corpus:
    text_dir: "corpus"
    manifest_file: "corpus/manifest.yml"
  splitter:
    chunk_size: 900
    chunk_overlap: 180
  embedder:
    model: "text-embedding-3-small"
    base_url: "https://llm.inzhenerka-cloud.com/"
    dimensions: 1536
  store:
    collection: "ural_corpus"
    location: "https://qdrant-stand.inzhenerka-cloud.com:443"  # or :memory:
  retriever:
    k: 3
    score_threshold: 0.6

# Various app-wide settings
app:
  log_level: "INFO"
